<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dead AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">☠️</div>

      <div>
        <h1>Dead AI</h1>
        <p>Personal AI Assistant</p>
      </div>

      <div class="status">
        ● Online
      </div>
    </header>


    <main id="chat">

      <div class="message ai">
        <strong>Dead AI</strong>

        <p>
          Hey 👋 I'm Dead AI.
          Ask me anything.
        </p>
      </div>

    </main>


    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Message Dead AI..."
        autocomplete="off"
      >

      <button id="sendBtn">
        ➤
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
